# PAL ∈ PEG (PalPeg.PalInPeg.unconditional, standard axioms only): the window-pal automaton of
# ../generator, turned into a PEG by the Kim–Park Lean artifact (PegSeparation). The toolchain and
# Mathlib are pinned to the versions the artifact was checked with (Lean v4.31.0, Mathlib v4.31.0).
name = "pal-peg"
version = "0.1.0"
defaultTargets = ["PalPeg"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

# Kim–Park, "Separating Parsing Expression Grammars using Cell-Probe Lower Bounds:
# Lean Artifact", v0.1.0 (Zenodo 10.5281/zenodo.22099762), commit c364edb.
[[require]]
name = "PegSeparation"
git = "https://github.com/kimjg1119/peg-separation-artifact"
rev = "c364edb"

[[lean_lib]]
name = "PalPeg"
